<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title th:text="${title}">The Blog</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f6f1e8;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table {
            border-collapse: collapse;
        }

        .kicker {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #78716c;
        }

        .wordmark {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 22px;
            line-height: 1.2;
            color: #1c1917;
        }

        .logo-mark {
            display: inline-block;
            width: 48px;
            height: 48px;
            line-height: 48px;
            text-align: center;
            border: 1px solid #1c1917;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 20px;
            color: #1c1917;
        }

        .headline {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 32px;
            line-height: 1.25;
            color: #1c1917;
        }

        .body-copy {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 16px;
            line-height: 1.75;
            color: #44403c;
        }

        .meta {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.6;
            color: #78716c;
        }

        .fallback a {
            color: #9a3412;
            word-break: break-all;
        }

        @media only screen and (max-width: 620px) {
            .headline {
                font-size: 26px !important;
            }

            .canvas {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
<th:block th:fragment="header" th:with="brand=${appName != null ? appName : 'The Blog'}">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td valign="middle" style="padding-right: 16px; width: 48px;">
                <img th:if="${logoUrl != null and !#strings.isEmpty(logoUrl)}"
                     th:src="${logoUrl}"
                     th:alt="${brand}"
                     width="48"
                     height="48"
                     style="display: block; border: 0; width: 48px; height: 48px;">
                <span th:unless="${logoUrl != null and !#strings.isEmpty(logoUrl)}"
                      class="logo-mark"
                      th:text="${#strings.substring(brand, 0, 1)}">T</span>
            </td>
            <td valign="middle">
                <div class="kicker">A letter from</div>
                <div class="wordmark" th:text="${brand}">The Blog</div>
            </td>
        </tr>
    </table>
</th:block>

<th:block th:fragment="button(url, label)">
    <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
            <td bgcolor="#9a3412" style="background-color: #9a3412;">
                <a th:href="${url}"
                   th:text="${label}"
                   style="display: inline-block; padding: 14px 28px; font-family: Georgia, 'Times New Roman', serif; font-size: 16px; color: #f6f1e8; text-decoration: none;">
                    Verify email
                </a>
            </td>
        </tr>
    </table>
</th:block>

<th:block th:fragment="footer(note)">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td style="padding-top: 28px; border-top: 1px solid #d6d3d1;">
                <p class="meta" style="margin: 0;" th:text="${note}">
                    You received this because you signed up.
                </p>
            </td>
        </tr>
    </table>
</th:block>
</body>
</html>
