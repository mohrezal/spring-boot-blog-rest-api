<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{email/layout :: head('Verify your email')}"></head>
<body style="margin: 0; padding: 0; background-color: #f6f1e8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f6f1e8;">
    <tr>
        <td align="center" style="padding: 48px 16px;">
            <table role="presentation" class="canvas" width="600" cellpadding="0" cellspacing="0">
                <tr>
                    <td style="padding-bottom: 36px;">
                        <th:block th:replace="~{email/layout :: header}"></th:block>
                    </td>
                </tr>
                <tr>
                    <td style="padding-bottom: 20px; border-top: 1px solid #d6d3d1;"></td>
                </tr>
                <tr>
                    <td style="padding: 8px 0 20px;">
                        <h1 class="headline" style="margin: 0;">Still need to verify.</h1>
                    </td>
                </tr>
                <tr>
                    <td class="body-copy" style="padding-bottom: 28px;">
                        Hello <span th:text="${userName}">Reader</span>,
                        we saved you a seat. This link is good for 24 hours.
                    </td>
                </tr>
                <tr>
                    <td style="padding-bottom: 20px;">
                        <th:block th:replace="~{email/layout :: button(${verificationUrl}, 'Verify email')}"></th:block>
                    </td>
                </tr>
                <tr>
                    <td class="meta fallback" style="padding-bottom: 36px;">
                        If the button does nothing, paste this into a browser:
                        <br>
                        <a th:href="${verificationUrl}" th:text="${verificationUrl}">verification link</a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <th:block
                                th:replace="~{email/layout :: footer('If you did not create an account, ignore this note.')}"></th:block>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
