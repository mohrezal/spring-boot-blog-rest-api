services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: blog-api
    ports:
      - "${APPLICATION_SERVER_PORT}:8080"
    env_file:
      - .env
    environment:
      - APPLICATION_DATABASE_HOST=db
      - APPLICATION_DATABASE_PORT=5432
      - APPLICATION_STORAGE_ENDPOINT=http://static:8333
      - APPLICATION_RABBIT_MQ_HOST=rabbitmq
      - APPLICATION_RABBIT_MQ_PORT=5672
      - APPLICATION_MAIL_HOST=mail
      - APPLICATION_MAIL_PORT=1025
      - APPLICATION_REDIS_HOST=redis
      - APPLICATION_REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      static:
        condition: service_started
      mail:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - blog-network
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: blog-db
    ports:
      - "${APPLICATION_DATABASE_PORT}:5432"
    environment:
      - POSTGRES_DB=${APPLICATION_DATABASE_NAME}
      - POSTGRES_USER=${APPLICATION_DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${APPLICATION_DATABASE_PASSWORD}
    volumes:
      - database:/var/lib/postgresql
    networks:
      - blog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APPLICATION_DATABASE_USERNAME} -d ${APPLICATION_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  static:
    image: chrislusf/seaweedfs:4.07
    container_name: seaweedfs
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data"
    volumes:
      - static-data:/data
      - ./configs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - blog-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.3-management
    container_name: rabbitmq
    ports:
      - "${APPLICATION_RABBIT_MQ_PORT}:5672"
      - "${APPLICATION_RABBIT_MQ_CLIENT_PORT}:15672"
      - "${APPLICATION_RABBIT_MQ_PROMETHEUS_PORT}:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${APPLICATION_RABBIT_MQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${APPLICATION_RABBIT_MQ_PASSWORD}
    volumes:
      - ./configs/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    networks:
      - blog-network
    restart: unless-stopped

  mail:
    image: axllent/mailpit:v1.28
    container_name: mailpit
    ports:
      - "${APPLICATION_MAIL_CLIENT_PORT}:8025"
      - "${APPLICATION_MAIL_PORT}:1025"
    networks:
      - blog-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    ports:
      - "${APPLICATION_REDIS_PORT}:6379"
    environment:
      - APPLICATION_REDIS_PASSWORD=${APPLICATION_REDIS_PASSWORD:?APPLICATION_REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$APPLICATION_REDIS_PASSWORD\"",
      ]
    volumes:
      - redis-data:/data
    networks:
      - blog-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$APPLICATION_REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      - APPLICATION_RABBIT_MQ_HOST=rabbitmq
      - APPLICATION_RABBIT_MQ_PORT=5672
      - APPLICATION_RABBIT_MQ_USERNAME=${APPLICATION_RABBIT_MQ_USERNAME}
      - APPLICATION_RABBIT_MQ_PASSWORD=${APPLICATION_RABBIT_MQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - blog-network
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: prometheus
    ports:
      - "${MONITORING_PROMETHEUS_PORT}:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - blog-network
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    ports:
      - "${MONITORING_GRAFANA_CLIENT_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${MONITORING_GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${MONITORING_GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - blog-network
    restart: unless-stopped
  loki:
    image: grafana/loki:3.6.8
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./configs/loki/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - blog-network
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.2.0
    container_name: alloy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - blog-network
    restart: unless-stopped
networks:
  blog-network:
    driver: bridge

volumes:
  database:
  static-data:
  redis-data:
  grafana-data:
