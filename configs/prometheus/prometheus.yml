global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: 'api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api:8081']
  - job_name: 'worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['worker:8082']